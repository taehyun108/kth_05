# 언론사 RSS 직접 구독 — ★1순위 수집 소스★ (docs/01-collect.md)
#
# 검색 API 와 방식이 다르다: 질의를 던지는 게 아니라 ★피드 전체를 받아서
# keywords.yaml 기준으로 걸러낸다★. 따라서 매체를 등록한 만큼만 커버된다.
# → 누락 감시는 S8 리포트의 '매체별 수집 건수 / 죽은 피드 / 미등록 매체 후보' 로 한다.
#
# ⚠️ 아래 url 은 ★예시 3건(플레이스홀더)★ 이다. Z2 에서 실제 주소를 확인해 채우고
#    verified: true 로 바꾼다. verified:false 인 피드는 실패해도 경고 수준만 올린다.
version: 1

defaults:
  timeout_sec: 15
  max_items: 100          # 피드당 상한 (과다 피드 방어)
  lang: ko

sources:
  - id: yonhap-economy
    name: 연합뉴스
    tier: 1                # outlet_tiers 와 별개로 피드 우선순위에 쓴다
    section: economy
    url: https://www.yna.co.kr/rss/economy.xml
    lang: ko
    enabled: true
    verified: false        # ← Z2 에서 확인 후 true
    notes: "경제 섹션. 통신사라 전재 원본이 많아 dedup 대표로 자주 선정된다."

  # ── 전자신문 (2026-09-01 실호출 확인) ──────────────────────────────────
  # 공식 RSS 목록: https://www.etnews.com/rss/  (200 · 전 섹션 40개)
  # 섹션 번호 체계: Section90x = 종합, 그 외는 숫자코드(06064 소재 / 06062 부품 …)
  - id: etnews-breaking
    name: 전자신문
    tier: 2
    section: breaking            # ★'뉴스속보' — 전 분야 혼재 firehose★
    url: https://rss.etnews.com/Section902.xml
    lang: ko
    enabled: true
    verified: true               # 2026-09-01 실호출: 200 text/xml · 30건 · 당일 기사
    notes: "전 분야가 섞여 오므로 키워드 필터 통과율이 낮다(정상). 최신성은 가장 좋다."

  - id: etnews-material
    name: 전자신문
    tier: 2
    section: material            # 전자>소재 — 양극재·음극재·전해액이 여기로 온다
    url: https://rss.etnews.com/06064.xml
    lang: ko
    enabled: true
    verified: true               # 2026-09-01 실호출: 200 text/xml · 50건 · 파싱 정상
    stale_days: 14               # 피드별 정체 임계(미지정 시 기본 14일)
    notes: >
      ⚠️ 실호출 시점 최신 기사가 2026-06-25 로 ★68일 정체★ 상태였다(LAST UPDATED 주석 동일).
      200 이 와도 갱신이 멈춘 피드가 있다 → coverage.stale_feeds 로 감시한다.
      Z2 에서 다시 확인해 여전히 정체면 etnews-breaking 으로 대체하고 enabled:false.

  # ── 아래는 공식 RSS 목록 페이지(2026-09-01 실호출, 200)에서 ★주소만★ 확보한 것.
  #    개별 피드는 아직 안 불러봤다 → enabled:false · verified:false.
  #    Z2 에서 하나씩 열어 200·XML·최신 기사일을 확인하고 켠다.
  #    전자신문 RSS 는 총 40개. 우리 용도(T1·T2·T3)와 무관한 섹션(연예·스포츠·게임 등)은 뺐다.
  - id: etnews-parts
    name: 전자신문
    tier: 2
    section: parts              # 전자>부품 — 소재 피드 정체 시 1순위 대체
    url: https://rss.etnews.com/06062.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-equipment
    name: 전자신문
    tier: 2
    section: equipment          # 전자>장비 — 전극공정·소성로(battery/equip)
    url: https://rss.etnews.com/06061.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-electronics
    name: 전자신문
    tier: 2
    section: electronics        # 전자 상위 — 06061~06065 를 포괄(중복 주의)
    url: https://rss.etnews.com/06.xml
    lang: ko
    enabled: false
    verified: false
    notes: "하위 섹션을 다 켜면 중복이 커진다. 상위 하나만 켜는 편이 나을 수 있다."

  - id: etnews-heavy
    name: 전자신문
    tier: 3
    section: heavy-industry     # 전자>중공업 — 철강 인접
    url: https://rss.etnews.com/06065.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-economy
    name: 전자신문
    tier: 2
    section: economy            # 경제 상위 (02024 는 하위 '경제')
    url: https://rss.etnews.com/02.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-mobility
    name: 전자신문
    tier: 2
    section: mobility           # 모빌리티 — 전기차 수요(battery/demand)
    url: https://rss.etnews.com/17.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-policy
    name: 전자신문
    tier: 2
    section: policy             # 정치·정책>정책 — T3
    url: https://rss.etnews.com/22210.xml
    lang: ko
    enabled: false
    verified: false

  - id: etnews-global
    name: 전자신문
    tier: 3
    section: global             # 국제 — T4 통상 보조
    url: https://rss.etnews.com/12.xml
    lang: ko
    enabled: false
    verified: false

  # ── 이데일리 (2026-09-01 실호출 확인) ──────────────────────────────────
  # ⚠️ https://www.edaily.co.kr/rss/ 는 200 을 주지만 ASP.NET 오류 폴백 페이지다
  #    (?aspxerrorpath=/rss/ 로 넘어간다). 섹션별 RSS 목록을 사이트에서 찾을 수 없었다.
  #    푸터의 RSS 링크로 확인된 것은 아래 ★전체뉴스 1개★ 뿐이다.
  - id: edaily-all
    name: 이데일리
    tier: 1
    section: all                 # 전 분야 firehose
    url: http://rss.edaily.co.kr/edaily_news.xml
    lang: ko
    enabled: true
    verified: true               # 2026-09-01 실호출: 200 text/xml · 50건 · 당일 기사
    max_items: 100
    notes: >
      전 분야가 오지만 ★<category> 가 채워져 온다★(산업/통상·금융·정책·전자 …).
      같은 기사가 카테고리만 바꿔 2건으로 오는 경우가 있다 → dedup L1(canonical URL)이 병합한다.
      응답이 UTF-8 BOM 으로 시작한다(파서 확인 완료).
      https 는 미확인 — 목록에 있는 대로 http 로 둔다. Z2 에서 https 가 되면 바꿀 것.

  - id: federal-register-energy
    name: Federal Register
    tier: 1
    section: policy
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=battery
    lang: en
    enabled: true
    verified: false
    stale_days: 7          # 관보는 매일 나온다. 일주일 비면 이상
    source_type: gazette   # 관보 → policy_stage 판정의 강한 신호 (stagers.py)
    notes: "T3 정책 원문. Proposed Rule/Final Rule 이 그대로 제목에 들어온다."
