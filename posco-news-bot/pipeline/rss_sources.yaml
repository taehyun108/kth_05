# 언론사 RSS 직접 구독 — ★1순위 수집 소스★ (docs/01-collect.md)
#
# 검색 API 와 방식이 다르다: 질의를 던지는 게 아니라 ★피드 전체를 받아서
# keywords.yaml 기준으로 걸러낸다★. 따라서 매체를 등록한 만큼만 커버된다.
# → 누락 감시는 S8 리포트의 '매체별 수집 건수 / 죽은 피드 / 미등록 매체 후보' 로 한다.
#
# ⚠️ 아래 url 은 ★예시 3건(플레이스홀더)★ 이다. Z2 에서 실제 주소를 확인해 채우고
#    verified: true 로 바꾼다. verified:false 인 피드는 실패해도 경고 수준만 올린다.
version: 1

defaults:
  timeout_sec: 15
  max_items: 100          # 피드당 상한 (과다 피드 방어)
  lang: ko

sources:
  - id: yonhap-economy
    name: 연합뉴스
    tier: 1                # outlet_tiers 와 별개로 피드 우선순위에 쓴다
    section: economy
    url: https://www.yna.co.kr/rss/economy.xml
    lang: ko
    enabled: true
    verified: false        # ← Z2 에서 확인 후 true
    notes: "경제 섹션. 통신사라 전재 원본이 많아 dedup 대표로 자주 선정된다."

  # ── 전자신문 (2026-09-01 실호출 확인) ──────────────────────────────────
  # 공식 RSS 목록: https://www.etnews.com/rss/  (200 · 전 섹션 40개)
  # 섹션 번호 체계: Section90x = 종합, 그 외는 숫자코드(06064 소재 / 06062 부품 …)
  - id: etnews-breaking
    name: 전자신문
    tier: 2
    section: breaking            # ★'뉴스속보' — 전 분야 혼재 firehose★
    url: https://rss.etnews.com/Section902.xml
    lang: ko
    enabled: true
    verified: true               # 2026-09-01 실호출: 200 text/xml · 30건 · 당일 기사
    notes: "전 분야가 섞여 오므로 키워드 필터 통과율이 낮다(정상). 최신성은 가장 좋다."

  - id: etnews-material
    name: 전자신문
    tier: 2
    section: material            # 전자>소재 — 양극재·음극재·전해액이 여기로 온다
    url: https://rss.etnews.com/06064.xml
    lang: ko
    enabled: true
    verified: true               # 2026-09-01 실호출: 200 text/xml · 50건 · 파싱 정상
    notes: >
      ⚠️ 실호출 시점 최신 기사가 2026-06-25 로 ★68일 정체★ 상태였다(LAST UPDATED 주석 동일).
      200 이 와도 갱신이 멈춘 피드가 있다 → coverage.stale_feeds 로 감시한다.
      Z2 에서 다시 확인해 여전히 정체면 etnews-breaking 으로 대체하고 enabled:false.

  # 아래는 공식 RSS 목록 페이지에서 확인한 주소(개별 실호출 전 → verified:false)
  - id: etnews-parts
    name: 전자신문
    tier: 2
    section: parts
    url: https://rss.etnews.com/06062.xml
    lang: ko
    enabled: false
    verified: false
    notes: "전자>부품. 소재 피드가 정체 상태라 대체 후보."

  - id: etnews-policy
    name: 전자신문
    tier: 2
    section: policy
    url: https://rss.etnews.com/22210.xml
    lang: ko
    enabled: false
    verified: false
    notes: "정책 섹션 — T3 보강 후보."

  - id: federal-register-energy
    name: Federal Register
    tier: 1
    section: policy
    url: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bterm%5D=battery
    lang: en
    enabled: true
    verified: false
    source_type: gazette   # 관보 → policy_stage 판정의 강한 신호 (stagers.py)
    notes: "T3 정책 원문. Proposed Rule/Final Rule 이 그대로 제목에 들어온다."
